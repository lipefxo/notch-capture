# Every successful master build becomes an immutable Sparkle release.
#
# Required secret:
#   SPARKLE_ED_PRIVATE_KEY   Raw private key exported by `generate_keys -x`.
#
# Optional Developer ID + notarization secrets (the default is an ad-hoc build):
#   DEVELOPER_ID_P12, DEVELOPER_ID_P12_PASSWORD, CODESIGN_IDENTITY_NAME,
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD
name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: notch-capture-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: macos-15
    env:
      HAS_DEVELOPER_ID: ${{ secrets.DEVELOPER_ID_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is required for the monotonic commit-count build number.
          fetch-depth: 0

      - name: Select Xcode 26.3
        run: sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer

      - name: Derive release metadata
        run: |
          BUILD_NUMBER="$(git rev-list --count HEAD)"
          VERSION="0.1.$BUILD_NUMBER"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Run tests
        run: swift test

      - name: Import Developer ID certificate
        if: env.HAS_DEVELOPER_ID == 'true'
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          echo "CODESIGN_IDENTITY=${{ secrets.CODESIGN_IDENTITY_NAME }}" >> "$GITHUB_ENV"

      - name: Note ad-hoc build
        if: env.HAS_DEVELOPER_ID != 'true'
        run: echo "No Developer ID secrets — shipping an ad-hoc signed, unnotarized build."

      - name: Package release
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_ED_PRIVATE_KEY" ]; then
            echo "::error::SPARKLE_ED_PRIVATE_KEY is required for secure Sparkle updates."
            exit 1
          fi
          KEY_FILE="$RUNNER_TEMP/sparkle_ed_key"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          export SPARKLE_ED_KEY_FILE="$KEY_FILE"
          Scripts/package-release.sh "$VERSION"

      - name: Create or repair GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            git fetch --force origin \
              "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            TAG_COMMIT="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
              echo "release tag $RELEASE_TAG points to $TAG_COMMIT, expected $GITHUB_SHA" >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "Notch Capture $VERSION" \
              --generate-notes
          fi
          gh release upload "$RELEASE_TAG" --clobber \
            "dist/NotchCapture-$VERSION.zip" \
            "dist/NotchCapture-$VERSION.dmg"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stage appcast site
        run: |
          mkdir -p "$RUNNER_TEMP/pages"
          cp dist/appcast.xml "$RUNNER_TEMP/pages/appcast.xml"

      - name: Upload appcast site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages

  deploy-appcast:
    if: github.ref == 'refs/heads/master'
    needs: release
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy appcast to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
