# Release pipeline: builds, tests, packages, and publishes on a `v*` tag push.
#
# Secrets (all optional except the EdDSA key):
#   SPARKLE_ED_PRIVATE_KEY   Required for signed updates — raw private key from
#                            `generate_keys -x` (Sparkle refuses unsigned
#                            archives unless the app is Developer ID signed).
#   DEVELOPER_ID_P12         Base64 Developer ID Application .p12. Adding this
#   DEVELOPER_ID_P12_PASSWORD  plus the three notarization secrets below
#   CODESIGN_IDENTITY_NAME   activates real signing + notarization; without
#   APPLE_ID                 them the workflow ships an ad-hoc build and
#   APPLE_TEAM_ID            testers use "Open Anyway" on first install.
#   APPLE_APP_PASSWORD
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      HAS_DEVELOPER_ID: ${{ secrets.DEVELOPER_ID_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: CFBundleVersion is `git rev-list --count HEAD`.
          fetch-depth: 0

      - name: Derive version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Run tests
        run: swift test

      - name: Import Developer ID certificate
        if: env.HAS_DEVELOPER_ID == 'true'
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          echo "CODESIGN_IDENTITY=${{ secrets.CODESIGN_IDENTITY_NAME }}" >> "$GITHUB_ENV"

      - name: Note ad-hoc build
        if: env.HAS_DEVELOPER_ID != 'true'
        run: echo "No Developer ID secrets — shipping an ad-hoc signed, un-notarized build."

      - name: Package release
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          if [ -n "$SPARKLE_ED_PRIVATE_KEY" ]; then
            KEY_FILE="$RUNNER_TEMP/sparkle_ed_key"
            printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$KEY_FILE"
            export SPARKLE_ED_KEY_FILE="$KEY_FILE"
          else
            echo "::warning::SPARKLE_ED_PRIVATE_KEY not set — appcast entries will be unsigned."
          fi
          Scripts/package-release.sh "$VERSION"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Notch Capture $VERSION" \
            --generate-notes \
            "dist/NotchCapture-$VERSION.zip"

      - name: Publish appcast to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git worktree add "$RUNNER_TEMP/gh-pages" origin/gh-pages
          else
            git worktree add --detach "$RUNNER_TEMP/gh-pages"
            git -C "$RUNNER_TEMP/gh-pages" checkout --orphan gh-pages
            git -C "$RUNNER_TEMP/gh-pages" rm -rf --quiet . || true
          fi
          cp dist/appcast.xml "$RUNNER_TEMP/gh-pages/appcast.xml"
          git -C "$RUNNER_TEMP/gh-pages" add appcast.xml
          git -C "$RUNNER_TEMP/gh-pages" commit -m "appcast for $GITHUB_REF_NAME"
          git -C "$RUNNER_TEMP/gh-pages" push origin HEAD:gh-pages
